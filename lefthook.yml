# https://lefthook.dev/configuration/
pre-commit:
  parallel: true
  jobs:
    - name: eslint
      glob: "*.{js,jsx,ts,tsx}"
      run: npx eslint {staged_files}
    - name: prettier
      glob: "*.{js,jsx,ts,tsx,json,css,md,html}"
      run: npx prettier --write {staged_files}
      stage_fixed: true

pre-push:
  jobs:
    - name: eslint
      run: npm run lint
